<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f58fc0">
<title>Creaciones Yazmin — Moños hechos con amor</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <header class="brand">
    <img src="assets/logo-creaciones-yazmin.png" class="logo" alt="Creaciones Yazmin">
    <div class="headline">
      <div class="title">MOÑOS</div>
      <div class="subtitle">HECHOS CON AMOR <span>♡</span></div>
    </div>
    <div class="floral floral-a">✿</div><div class="floral floral-b">✿</div>
  </header>

  <nav class="quick-grid" aria-label="Navegación principal">
    <button class="quick purple" data-action="login"><span class="ico">♟</span><span>Iniciar<br>sesión</span></button>
    <button class="quick pink" data-action="register"><span class="ico">♟+</span><span>Registrarse</span></button>
    <button class="quick purple" data-category="Moños"><span class="ico">🎀</span><span>Moños</span></button>
    <button class="quick pink" data-category="Diademas"><span class="ico">♕</span><span>Diademas</span></button>
    <button class="quick purple" data-category="Listón"><span class="ico">▣</span><span>Listón</span></button>
    <button class="quick pink" data-action="contact"><span class="ico">💬</span><span>Contacto</span></button>
    <button class="quick purple" data-action="orders"><span class="ico">☷</span><span>Pedidos</span></button>
    <button class="quick pink cart-btn" data-action="cart"><span class="ico">🛒</span><span>Carrito <b id="cartCount">0</b></span></button>
  </nav>

  <section class="searchbox">
    <div class="searchfield"><span>⌕</span><input id="search" placeholder="Buscar productos..." autocomplete="off"></div>
    <button id="searchBtn">Buscar</button>
  </section>

  <section class="hero-card">
    <div class="slides" id="slides">
      <img src="assets/hero-1.jpg" alt="Nuevos diseños de moños" class="slide active">
      <img src="assets/hero-1.jpg" alt="Moños para cada ocasión" class="slide">
      <img src="assets/hero-1.jpg" alt="Diseños personalizados" class="slide">
      <img src="assets/hero-1.jpg" alt="Creaciones Yazmin" class="slide">
    </div>
    <button class="arrow left" id="prev" aria-label="Anterior">‹</button>
    <button class="arrow right" id="next" aria-label="Siguiente">›</button>
    <div class="dots" id="dots"><button class="on"></button><button></button><button></button><button></button></div>
  </section>

  <section class="recent">
    <div class="section-head">
      <h2><span>🎀</span> Recientes</h2>
      <button id="allBtn">Ver todos ›</button>
    </div>
    <div class="products" id="products"></div>
  </section>

  <section class="create">
    <img src="assets/create-banner.jpg" alt="Crea tu moño">
    <div class="create-overlay">
      <h2>Crea tu moño</h2>
      <p>Personaliza tu estilo ♥</p>
      <button id="createBtn">Comenzar ›</button>
    </div>
  </section>

  <footer>Creaciones Yazmin · Todos los derechos © reservados</footer>
</main>

<div class="modal" id="modal">
  <div class="modal-card">
    <button class="close" id="close">×</button>
    <h3 id="modalTitle">Creaciones Yazmin</h3>
    <p id="modalText"></p>
    <button class="modal-primary" id="modalOk">Aceptar</button>
  </div>
</div>
<script type="module" src="script.js"></script>
</body>
</html>
